[project]
name = "agent-guardrails"
version = "0.1.0"
description = "Runtime guardrails for LLM agents: tool-call policy engine, budgets, approvals, and audit logging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8", "pyyaml>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_guardrails*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
