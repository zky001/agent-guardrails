<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 570" font-family="ui-sans-serif,-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="570" fill="#ffffff"/>

  <!-- human-intervention phase background -->
  <rect x="30" y="228" width="880" height="92" rx="8" fill="#f8fafc"/>
  <text x="48" y="247" font-size="11" fill="#94a3b8">人工介入</text>

  <!-- lifelines -->
  <line x1="125" y1="66" x2="125" y2="525" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="385" y1="66" x2="385" y2="525" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="650" y1="66" x2="650" y2="525" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,5"/>
  <line x1="850" y1="66" x2="850" y2="525" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,5"/>

  <!-- lane headers -->
  <rect x="40" y="20" width="170" height="46" rx="9" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="125" y="49" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d4ed8">Agent 运行时</text>

  <rect x="300" y="20" width="170" height="46" rx="9" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="385" y="49" text-anchor="middle" font-size="15" font-weight="bold" fill="#b45309">围栏引擎</text>

  <rect x="560" y="20" width="180" height="46" rx="9" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="650" y="42" text-anchor="middle" font-size="15" font-weight="bold" fill="#15803d">审批网关</text>
  <text x="650" y="59" text-anchor="middle" font-size="10.5" fill="#15803d">Memory / Callback / 自定义</text>

  <rect x="790" y="20" width="120" height="46" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="850" y="49" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">审批人</text>

  <!-- ① call -->
  <text x="255" y="98" text-anchor="middle" font-size="12.5" fill="#0f172a">① 调用 email_0 · TOOL_CALL 检查</text>
  <line x1="125" y1="112" x2="381" y2="112" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ② register -->
  <text x="517" y="143" text-anchor="middle" font-size="12.5" fill="#0f172a">② 命中审批规则 → request() 幂等登记</text>
  <line x1="385" y1="157" x2="646" y2="157" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ③ suspend -->
  <text x="255" y="188" text-anchor="middle" font-size="12.5" fill="#0f172a">③ 抛 ApprovalRequired · 运行挂起</text>
  <line x1="385" y1="202" x2="129" y2="202" stroke="#475569" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ④ notify -->
  <text x="750" y="238" text-anchor="middle" font-size="12.5" fill="#0f172a">④ pending() / IM 通知</text>
  <line x1="650" y1="252" x2="846" y2="252" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ⑤ resolve -->
  <text x="750" y="283" text-anchor="middle" font-size="12.5" fill="#0f172a">⑤ resolve(id, 批准/拒绝)</text>
  <line x1="850" y1="297" x2="654" y2="297" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ⑥ replay -->
  <text x="255" y="338" text-anchor="middle" font-size="12.5" fill="#0f172a">⑥ 恢复运行 · 重放同一调用</text>
  <line x1="125" y1="352" x2="381" y2="352" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ⑦ fingerprint hit -->
  <text x="517" y="378" text-anchor="middle" font-size="12.5" fill="#0f172a">⑦ 指纹命中已决议记录</text>
  <line x1="385" y1="392" x2="646" y2="392" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- return status -->
  <text x="517" y="413" text-anchor="middle" font-size="12.5" fill="#64748b">approved / denied</text>
  <line x1="650" y1="427" x2="389" y2="427" stroke="#475569" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- ⑧ final -->
  <text x="255" y="468" text-anchor="middle" font-size="12.5" fill="#0f172a">⑧ 放行执行 ✔ / GuardrailDenied ✘</text>
  <line x1="385" y1="482" x2="129" y2="482" stroke="#475569" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- footer note -->
  <text x="470" y="552" text-anchor="middle" font-size="12" fill="#64748b">幂等指纹 sha256(run_id + 工具名 + 排序参数)：同一调用不重复开单；参数变化视为新调用</text>
</svg>
